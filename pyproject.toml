[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (неиспользуемые импорты, неопределённые имена)
    "I",   # isort (порядок импортов)
    "B",   # flake8-bugbear (частые баги)
    "UP",  # pyupgrade (современный синтаксис)
]
ignore = [
    "E501",  # длина строки (пусть форматтер решает)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # assert разрешён в тестах
"__init__.py" = ["F401"]    # неиспользуемые импорты в __init__